# Docker uses DIFFERENT host ports than a local run, so both can run at the same time:
#   Docker: app http://localhost:8081   PostgreSQL localhost:5433
#   Local : app http://localhost:8080   PostgreSQL localhost:5432
# Start:  docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: fee-postgres
    environment:
      POSTGRES_DB: feedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"   # 5433 on your machine -> no clash with a locally installed Postgres on 5432
    volumes:
      - fee-pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feedb"]
      interval: 5s
      retries: 10

  app:
    build: .
    container_name: fee-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/feedb   # "postgres" = service name on the compose network
      DB_USER: postgres
      DB_PASSWORD: postgres
      SEED_DATA: "true"
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "${APP_HOST_PORT:-8081}:8080"   # 8081 on your machine -> no clash with a local run on 8080
    depends_on:
      postgres:
        condition: service_healthy   # app starts only after DB accepts connections
    restart: unless-stopped

volumes:
  fee-pgdata:
